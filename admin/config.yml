backend:
  name: github
  repo: davidiasdamaceno-prog/somentecrer
  branch: main
  base_url: https://decap-oauth-provider.vercel.app
  auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "geral"
    label: "Informações Gerais"
    files:
      - label: "Página Inicial"
        name: "home"
        file: "content/home.json"
        fields:
          - { label: "Versículo do Dia", name: "versiculo", widget: "text" }
          - { label: "Referência do Versículo", name: "referencia", widget: "string" }
          - label: "Horários de Culto"
            name: "horarios"
            widget: "list"
            fields:
              - { label: "Dia", name: "dia", widget: "string" }
              - { label: "Horário", name: "hora", widget: "string" }

  - name: "avisos"
    label: "Avisos"
    folder: "content/avisos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Texto", name: "body", widget: "markdown" }
      - { label: "Imagem (opcional)", name: "imagem", widget: "image", required: false }

  - name: "eventos"
    label: "Eventos"
    folder: "content/eventos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome do Evento", name: "title", widget: "string" }
      - { label: "Data do Evento", name: "date", widget: "datetime" }
      - { label: "Local", name: "local", widget: "string" }
      - { label: "Descrição", name: "descricao", widget: "text" }
